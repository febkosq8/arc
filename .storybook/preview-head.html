<style>
	html {
		background: hsl(var(--background));
	}

	body {
		background: hsl(var(--background));
		color: hsl(var(--foreground));
		font-family: ui-sans-serif, system-ui, sans-serif;
		-webkit-font-smoothing: antialiased;
		-moz-osx-font-smoothing: grayscale;
	}

	.sbdocs.sbdocs-wrapper {
		background: hsl(var(--background));
		color: hsl(var(--foreground));
	}

	.sbdocs,
	.sbdocs p,
	.sbdocs li,
	.sbdocs td,
	.sbdocs th {
		color: hsl(var(--foreground));
		font-family: ui-sans-serif, system-ui, sans-serif;
	}

	.sbdocs p,
	.sbdocs li {
		line-height: 1.7;
	}

	.sbdocs-title {
		color: hsl(var(--foreground)) !important;
		font-size: 2.25rem;
		font-weight: 700;
		letter-spacing: -0.025em;
		line-height: 1.15;
	}

	.sbdocs-subtitle,
	.sbdocs-content > p:first-of-type,
	.sbdocs-title + div > p {
		color: hsl(var(--muted-foreground)) !important;
	}

	.sbdocs h1,
	.sbdocs h2,
	.sbdocs h3 {
		color: hsl(var(--foreground)) !important;
	}

	.sbdocs h2 {
		border-bottom: 1px solid hsl(var(--border));
	}

	.sbdocs a {
		color: hsl(var(--primary)) !important;
	}

	.sbdocs-preview {
		background: hsl(var(--card));
		border: 1px solid hsl(var(--border));
		border-radius: var(--radius);
		overflow: hidden;
	}

	.sbdocs-preview .docs-story {
		background: hsl(var(--background));
	}

	.sbdocs :not(pre) > code {
		background: hsl(var(--muted));
		border-radius: 0.25rem;
		color: hsl(var(--muted-foreground)) !important;
		padding: 0.2rem 0.3rem;
	}

	.docblock-source {
		background: hsl(var(--card)) !important;
		border: 1px solid hsl(var(--border)) !important;
		border-radius: var(--radius) !important;
	}

	.docblock-argstable tbody,
	.docblock-argstable tbody tr,
	.docblock-argstable tbody td {
		background: hsl(var(--card)) !important;
		border-color: hsl(var(--border)) !important;
	}

	.docblock-argstable {
		border: 1px solid hsl(var(--border)) !important;
		border-collapse: separate;
		border-radius: var(--radius);
		overflow: hidden;
	}

	.docblock-argstable th,
	.docblock-argstable td {
		border: 0 !important;
		border-bottom: 1px solid hsl(var(--border)) !important;
	}

	.docblock-argstable th:not(:last-child),
	.docblock-argstable td:not(:last-child) {
		border-right: 1px solid hsl(var(--border)) !important;
	}

	.docblock-argstable tr:last-child td {
		border-bottom: 0 !important;
	}

	.docblock-argstable th {
		color: hsl(var(--muted-foreground)) !important;
	}

	.docblock-argstable td > *,
	.docblock-argstable td > * * {
		color: hsl(var(--foreground)) !important;
	}

	.docblock-argstable td > div + div,
	.docblock-argstable td > div + div * {
		color: hsl(var(--muted-foreground)) !important;
	}

	.docblock-argstable td > div + div span,
	.docblock-argstable td:nth-child(3) span {
		background: color-mix(in srgb, hsl(var(--card)) 88%, hsl(var(--foreground)) 12%) !important;
		border: 1px solid color-mix(in srgb, hsl(var(--border)) 78%, hsl(var(--foreground)) 22%) !important;
		border-radius: 0.25rem;
		color: hsl(var(--foreground)) !important;
		display: inline-block;
		padding: 0.125rem 0.375rem;
	}

	.sbdocs input,
	.sbdocs select,
	.sbdocs textarea {
		background: hsl(var(--card));
		border-color: hsl(var(--border));
		color: hsl(var(--foreground));
	}

	.docblock-argstable select,
	.docblock-argstable textarea {
		border: 1px solid hsl(var(--border)) !important;
		border-radius: 0.375rem;
		box-shadow: none !important;
		min-height: 2rem;
	}

	.docblock-argstable select {
		padding: 0.375rem 2rem 0.375rem 0.625rem;
	}

	.docblock-argstable textarea {
		padding: 0.375rem 0.625rem;
		resize: vertical;
	}

	.docblock-argstable td > span:has(> select) {
		display: block;
		position: relative;
	}

	.docblock-argstable td > span:has(> select) > svg {
		color: hsl(var(--muted-foreground));
		pointer-events: none;
	}

	.docblock-argstable label:has(> input[role="switch"]) {
		align-items: center;
		background: hsl(var(--muted)) !important;
		border: 1px solid hsl(var(--border)) !important;
		border-radius: 999px;
		display: inline-flex;
		gap: 0.125rem;
		padding: 0.125rem;
		position: relative;
	}

	.docblock-argstable label[aria-disabled]:has(> input[type="checkbox"]) {
		background: hsl(var(--muted)) !important;
		border: 1px solid hsl(var(--border)) !important;
		border-radius: 999px;
	}

	.docblock-argstable label:has(> input[role="switch"]) > input {
		height: 1px;
		opacity: 0;
		position: absolute;
		width: 1px;
	}

	.docblock-argstable label:has(> input[role="switch"]) > span {
		border-radius: 999px;
		background: transparent !important;
		color: hsl(var(--muted-foreground)) !important;
		font-size: 0.75rem;
		line-height: 1.25rem;
		padding: 0 0.625rem;
	}

	.docblock-argstable label[aria-disabled]:has(> input[type="checkbox"]) > span {
		background: transparent !important;
		color: hsl(var(--muted-foreground)) !important;
	}

	.docblock-argstable label:has(> input[role="switch"]) > input:not(:checked) + span,
	.docblock-argstable label:has(> input[role="switch"]:checked) > input + span + span {
		background: hsl(var(--card)) !important;
		box-shadow: 0 0 0 1px hsl(var(--border)) !important;
		color: hsl(var(--foreground)) !important;
	}

	.docblock-argstable button[id^="set-"] {
		background: hsl(var(--muted)) !important;
		border: 1px solid hsl(var(--border)) !important;
		border-radius: 0.375rem;
		box-shadow: none !important;
		color: hsl(var(--foreground)) !important;
		min-height: 2rem;
		padding: 0.375rem 0.75rem;
	}

	.docblock-argstable button[id^="set-"]:hover {
		background: hsl(var(--accent)) !important;
		color: hsl(var(--accent-foreground)) !important;
	}

	.sbdocs input:focus,
	.sbdocs select:focus,
	.sbdocs textarea:focus {
		border-color: hsl(var(--ring));
		box-shadow: 0 0 0 2px hsl(var(--ring) / 0.25);
		outline: none;
	}
</style>
