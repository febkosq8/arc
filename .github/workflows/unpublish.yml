name: Unpublish

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: Version to unpublish instead of the package.json version (leave empty to use package.json)
        type: string
        default: ""
      delete_tag:
        description: Delete the version Git tag
        type: boolean
        default: true
      delete_release:
        description: Delete the GitHub release
        type: boolean
        default: true
      delete_npm:
        description: Unpublish the package version from npm
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      package_name: ${{ steps.version.outputs.package_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version and prepare unpublish preview
        id: version
        env:
          DELETE_TAG: ${{ inputs.delete_tag }}
          DELETE_RELEASE: ${{ inputs.delete_release }}
          DELETE_NPM: ${{ inputs.delete_npm }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          node --input-type=module -e '
            import { appendFileSync, readFileSync } from "node:fs";

            const override = process.env.VERSION_OVERRIDE.trim();
            if (override && !/^[0-9A-Za-z][0-9A-Za-z._+-]*$/.test(override)) {
              throw new Error(`Invalid version override: ${override}`);
            }
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const version = override || pkg.version;
            if (!version || !/^[0-9A-Za-z][0-9A-Za-z._+-]*$/.test(version)) {
              throw new Error(`Invalid package version: ${version}`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `package_name=${pkg.name}\n`);

            const summary = [
              "## Unpublish preview",
              "",
              `Package: \`${pkg.name}\``,
              "",
              `Version: \`v${version}\``,
              "",
              `- Delete Git tag: ${process.env.DELETE_TAG}`,
              `- Delete GitHub release: ${process.env.DELETE_RELEASE}`,
              `- Unpublish from npm: ${process.env.DELETE_NPM}`,
              "",
            ].join("\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          '

  check:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Git tag exists
        if: inputs.delete_tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! existing_tag=$(git ls-remote --tags origin "refs/tags/${tag}"); then
              echo "::error::Could not check whether Git tag ${tag} exists."
              exit 1
          fi
          if [ -z "$existing_tag" ]; then
              echo "::error::Git tag ${tag} does not exist; nothing to delete."
              printf '\n> [!WARNING]\n> Git tag `%s` does not exist; nothing to delete.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
          printf '\n> [!WARNING]\n> Git tag `%s` exists and will be deleted.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Check GitHub release exists
        if: inputs.delete_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          status=$(curl --silent --show-error \
              --output "$RUNNER_TEMP/release.json" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")

          if [ "$status" = "404" ]; then
              echo "::error::GitHub release ${tag} does not exist; nothing to delete."
              printf '\n> [!WARNING]\n> GitHub release `%s` does not exist; nothing to delete.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          elif [ "$status" != "200" ]; then
              echo "::error::Could not check GitHub release ${tag} (HTTP ${status})."
              cat "$RUNNER_TEMP/release.json"
              exit 1
          fi
          printf '\n> [!WARNING]\n> GitHub release `%s` exists and will be deleted.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Check npm package version exists
        if: inputs.delete_npm
        env:
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          output="$RUNNER_TEMP/npm-view.out"
          if npm view "${PACKAGE_NAME}@${VERSION}" version --json > "$output" 2>&1; then
              printf '\n> [!WARNING]\n> npm package version `%s@%s` exists and will be unpublished.\n' "$PACKAGE_NAME" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eq 'E404|404 Not Found' "$output"; then
              echo "::error::npm package version ${PACKAGE_NAME}@${VERSION} does not exist; nothing to unpublish."
              printf '\n> [!WARNING]\n> npm package version `%s@%s` does not exist; nothing to unpublish.\n' "$PACKAGE_NAME" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          else
              echo "::error::Could not check npm package version ${PACKAGE_NAME}@${VERSION}."
              cat "$output"
              exit 1
          fi

  unpublish:
    needs: [prepare, check]
    if: inputs.delete_tag || inputs.delete_release || inputs.delete_npm
    runs-on: ubuntu-latest
    environment: Arc-Env
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: inputs.delete_npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Unpublish from npm
        id: npm
        if: inputs.delete_npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: npm unpublish "${PACKAGE_NAME}@${VERSION}" --force

      - name: Delete GitHub release
        id: release
        if: inputs.delete_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release delete "v${VERSION}" --yes --repo "$GITHUB_REPOSITORY"

      - name: Delete Git tag
        id: tag
        if: inputs.delete_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}"

      - name: Write unpublish summary
        if: always()
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          JOB_STATUS: ${{ job.status }}
          TAG_OUTCOME: ${{ steps.tag.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
        run: |
          report() {
              case "$2" in
                  success) echo "> - ✅ $1" ;;
                  failure) echo "> - ❌ $1" ;;
              esac
          }
          if [ "$JOB_STATUS" = "success" ]; then
              alert="NOTE"
              title="Removed \`v${VERSION}\`."
          else
              alert="WARNING"
              title="Removing \`v${VERSION}\` did not complete successfully."
          fi
          {
              echo
              echo "> [!${alert}]"
              echo "> ${title}"
              echo ">"
              report "Deleted GitHub release \`v${VERSION}\`" "$RELEASE_OUTCOME"
              report "Deleted Git tag \`v${VERSION}\`" "$TAG_OUTCOME"
              report "Unpublished npm package version \`${VERSION}\`" "$NPM_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
